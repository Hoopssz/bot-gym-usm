name: Reserva Automática Gimnasio USM

on:
  schedule:
    # Horario de Verano Chile (UTC-3 -> 06:07 AM CL)
    - cron: '7 9 * * 1-5'
    # Horario de Invierno Chile (UTC-4 -> 06:07 AM CL)
    - cron: '7 10 * * 1-5'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución'
        required: true
        default: 'test-login'
        type: choice
        options:
          - test-login
          - reservar-ahora
          - esperar-0630

concurrency:
  group: reserva-diaria-gym-usm
  cancel-in-progress: false

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar código del bot
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Bot Gimnasio USM
        env:
          GYM_EMAIL: ${{ secrets.GYM_EMAIL }}
          GYM_PASSWORD: ${{ secrets.GYM_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.modo }}" = "test-login" ]; then
              python3 bot.py --test-login
            elif [ "${{ inputs.modo }}" = "reservar-ahora" ]; then
              python3 bot.py --now
            else
              python3 bot.py
            fi
          else
            python3 bot.py
          fi
